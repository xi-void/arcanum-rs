# Copy to ${XDG_CONFIG_HOME:-$HOME/.config}/arcanum-rs/config.toml.
# Set the directory containing your Arcanum installation.
# Relative paths in this file are relative to config.toml.
game_data = "/path/to/Arcanum"

[gameplay]
difficulty = "normal"  # easy, normal or hard
turn_based = false

[window]
width = 1280
height = 720
fullscreen = false  # Borderless fullscreen on the current monitor.

[display]
lighting = true
shadows = true

[audio]
effects = 5  # 0–10, with 0 muting the channel.
voice = 5
music = 5

[ui]
hud = "classic"  # "classic", "off", package directory or theme.toml.
# map = "themes/my-map"  # Package directory or theme.toml.
# pause = "themes/my-pause"  # Package directory or theme.toml.
# scale = 100  # Shared requested scale, 50–300 percent. Omit for package default.

[camera]
zoom = 1  # 1, 2 or 3.
follow = false  # Home centers once. F5 toggles persistent player following.
edge_scroll = true
keyboard_pan = true  # Arrow keys, with Shift for faster scrolling.
recenter_key = "Home"  # Physical key code, e.g. Home, End or KeyC.

[input]
run = false

[developer]
enabled = false
rpc = false  # Requires enabled = true. The engine prints the socket path.
map_reveal = false
discover_all = false
# console_ui = "themes/console.toml"
# diagnostics = "captures"  # Create this directory before launching.

[mods]
# directory = "mods"
enabled = []  # IDs to load with their dependencies, using the existing mod VFS.
