name = "Arcanum-RS Container"
scale = 125
fit_viewport = [820, 460]

[fonts.heading]
source = "vfs:art/interface/newtimes16font.art"
size = 21
color = [242, 228, 194, 255]

[fonts.control]
source = "vfs:art/interface/newtimes16font.art"
size = 17
color = [232, 218, 187, 255]

[[hud]]
id = "panel"
size = [800, 400]
anchor = "center"
fill = [32, 25, 22, 254]
capture = true

[[hud]]
id = "panel-band"
parent = "panel"
offset = [14, 34]
size = [426, 11]
image = "vfs:art/interface/loot.art"
source_rect = [8, 115, 320, 11]

[[hud]]
id = "container-title"
parent = "panel"
offset = [17, 9]
size = [320, 31]
binding = "container-name"
font = "heading"

[[hud]]
id = "container-grid"
parent = "panel"
offset = [17, 67]
size = [320, 256]
binding = "container-grid"
image = "vfs:art/interface/loot.art"
source_rect = [8, 136, 320, 256]
fill = [17, 17, 18, 255]
grid_line = [54, 48, 43, 255]
hover_fill = [89, 65, 39, 255]

[[hud]]
id = "inventory-title"
parent = "panel"
offset = [352, 15]
size = [92, 25]
text = "Inventory"
font = "heading"

[[hud]]
id = "player-grid"
parent = "panel"
offset = [455, 8]
size = [320, 384]
binding = "player-grid"
image = "vfs:art/interface/inventor.art"
source_rect = [10, 8, 320, 384]
fill = [17, 17, 18, 255]
grid_line = [54, 48, 43, 255]
hover_fill = [89, 65, 39, 255]

[[hud]]
id = "use-unavailable"
parent = "panel"
offset = [360, 267]
size = [80, 43]
image = "vfs:art/interface/use_box_ill.art"
disabled = true

[[hud]]
id = "drop"
parent = "panel"
offset = [360, 320]
size = [80, 43]
image = "vfs:art/interface/drop_off.art"
hover_image = "vfs:art/interface/drop_on.art"
selected_image = "vfs:art/interface/drop_ill.art"
action = "inventory-drop"
binding = "inventory-drop"

[[hud]]
id = "close"
parent = "panel"
offset = [406, 49]
size = [26, 25]
text = "X"
font = "control"
align = "center"
action = "inventory-close"
hover_fill = [103, 72, 43, 255]

[[hud]]
id = "world-inset"
parent = "panel"
offset = [359, 105]
size = [89, 89]
binding = "player-lens"

[[hud]]
id = "world-inset-mask"
parent = "panel"
offset = [359, 105]
size = [89, 89]
image = "vfs:art/interface/lns_loot.art"

[[hud]]
id = "loot-scroll-up"
parent = "panel"
offset = [345, 67]
size = [11, 15]
image = "vfs:art/interface/scrllup.art"
action = "inventory-scroll-up"
pressed_frame = 1
hover_frame = 2

[[hud]]
id = "loot-scroll-track"
parent = "panel"
offset = [345, 82]
size = [11, 227]
image = "vfs:art/interface/loot.art"
binding = "inventory-scroll-track"
source_rect = [330, 151, 11, 227]

[[hud]]
id = "loot-scroll-thumb"
parent = "panel"
offset = [345, 82]
size = [11, 5]
image = "vfs:art/interface/scrllslidet.art"
binding = "inventory-scroll-thumb"

[[hud]]
id = "loot-scroll-down"
parent = "panel"
offset = [345, 309]
size = [11, 14]
image = "vfs:art/interface/scrlldwn.art"
action = "inventory-scroll-down"
pressed_frame = 1
hover_frame = 2

[[hud]]
id = "tooltip"
size = [202, 42]
binding = "inventory-detail"
font = "control"
wrap = true
fill = [15, 13, 13, 252]
