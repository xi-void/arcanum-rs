name = "Arcanum-RS Inventory"
scale = 125
fit_viewport = [820, 460]

[fonts.heading]
source = "vfs:art/interface/newtimes16font.art"
size = 21
color = [242, 228, 194, 255]

[fonts.control]
source = "vfs:art/interface/newtimes16font.art"
size = 17
color = [232, 218, 187, 255]

[[hud]]
id = "panel"
size = [800, 400]
anchor = "center"
fill = [32, 25, 22, 254]
capture = true

[[hud]]
id = "panel-band"
parent = "panel"
offset = [14, 34]
size = [426, 11]
image = "vfs:art/interface/loot.art"
source_rect = [8, 115, 320, 11]

[[hud]]
id = "inventory-title"
parent = "panel"
offset = [352, 15]
size = [92, 25]
text = "Inventory"
font = "heading"

[[hud]]
id = "player-grid"
parent = "panel"
offset = [455, 8]
size = [320, 384]
binding = "player-grid"
image = "vfs:art/interface/inventor.art"
source_rect = [10, 8, 320, 384]
fill = [17, 17, 18, 255]
grid_line = [54, 48, 43, 255]
hover_fill = [89, 65, 39, 255]

[[hud]]
id = "use-unavailable"
parent = "panel"
offset = [360, 267]
size = [80, 43]
image = "vfs:art/interface/use_box_ill.art"
disabled = true

[[hud]]
id = "drop"
parent = "panel"
offset = [360, 320]
size = [80, 43]
image = "vfs:art/interface/drop_off.art"
hover_image = "vfs:art/interface/drop_on.art"
selected_image = "vfs:art/interface/drop_ill.art"
action = "inventory-drop"
binding = "inventory-drop"

[[hud]]
id = "close"
parent = "panel"
offset = [406, 49]
size = [26, 25]
text = "X"
font = "control"
align = "center"
action = "inventory-close"
hover_fill = [103, 72, 43, 255]

[[hud]]
id = "world-inset"
