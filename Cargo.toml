[package]
name = "arcanum-rs"
version = "0.1.0"
edition = "2024"

[features]
windowed = ["dep:winit", "dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:png"]

[dependencies]
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
flate2 = "1.1.11"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.2.2", default-features = false, features = ["display", "parse", "serde", "std"] }

winit = { version = "0.30.13", optional = true, default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }
wgpu = { version = "26.0.1", optional = true, default-features = false, features = ["std", "vulkan", "wgsl"] }
pollster = { version = "0.4.0", optional = true }
bytemuck = { version = "1.24", optional = true, features = ["derive"] }
serde_json = "1"
png = { version = "0.18", optional = true }

[[bench]]
name = "baseline"
harness = false

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["net"] }
