[package]
name = "arcanum-rs"
version = "0.1.0"
edition = "2024"

[features]
windowed = ["dep:softbuffer", "dep:winit"]

[dependencies]
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
flate2 = "1.1.11"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.2.2", default-features = false, features = ["parse", "serde", "std"] }

softbuffer = { version = "0.4.8", optional = true, default-features = false, features = ["wayland", "wayland-dlopen", "x11", "x11-dlopen"] }
winit = { version = "0.30.13", optional = true, default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }

[[bench]]
name = "baseline"
harness = false
